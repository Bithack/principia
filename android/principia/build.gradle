plugins {
    id 'com.android.application'
    id 'de.undercouch.download'
}

android {
    compileSdk 35
    ndkVersion "27.2.12479018"
    namespace 'com.bithack.principia'

    defaultConfig {
        applicationId "com.bithack.principia"
        minSdk 21
        targetSdk 35
        versionCode 44
        versionName "2026.08.16"

        externalNativeBuild {
            cmake.arguments "-DUSE_VENDORED_SDL3=1", "-DUNITY_BUILD=1"
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            //abiFilters "arm64-v8a" // debugging on phone
            //abiFilters "x86_64"    // debugging on emulator
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'
}

// get precompiled deps
def depsVersion = '2026-08-19'
def depsZipName = "deps-${depsVersion}.zip"
def depsUrl = "https://dl.principia-web.se/deps/android/${depsZipName}"
def depsSha256 = '1349d086ef09197babb9a60ca23439c2d9be235512c88179f33be4daab9391c6'

def depsZip = new File(buildDir, depsZipName)
def depsDir = new File(buildDir.parent, '../deps')

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')

    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int n

        while ((n = input.read(buffer)) != -1)
            digest.update(buffer, 0, n)
    }

    digest.digest().collect { String.format('%02x', it) }.join()
}

tasks.register('downloadDeps', Download) {
    src depsUrl
    dest depsZip
    overwrite false

    onlyIf {
        !depsZip.exists()
    }
}

tasks.register('getDeps') {
    def existedBefore = depsZip.exists()

    dependsOn downloadDeps

    doLast {
        if (existedBefore) {
            println "Dependency archive already exists, skipping verification and extraction"
            return
        }

        println "New dependency archive downloaded: ${depsZip}"

        def actualSha256 = sha256(depsZip)

        if (!actualSha256.equalsIgnoreCase(depsSha256))
            throw new GradleException(
                "SHA-256 mismatch for ${depsZip.name}\n" +
                "Expected: ${depsSha256}\n" +
                "Actual:   ${actualSha256}")

        println "SHA-256 OK"
        println "Extracting dependencies..."

        project.delete(depsDir)

        copy { from zipTree(depsZip) into depsDir }
    }
}

preBuild.dependsOn getDeps
